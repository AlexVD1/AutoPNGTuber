<svg width="200" height="200" viewBox="-65 -65 130 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g transform="rotate(0.00) scale(1.45)">
    <!-- Cubo Grande (Mucha masa L3, cae pesado) -->
    <g transform="translate(-16, 6)">
      <polygon points="0,-28 26,-14 0,0 -26,-14" fill="#EF4444" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="-26,-14 0,0 0,30 -26,16" fill="#DC2626" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>
      <polygon points="0,0 26,-14 26,16 0,30" fill="#991B1B" stroke="#111827" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M 0,34 L 0,46 M -6,40 L 0,47 L 6,40" stroke="#EF4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <!-- Cubito Diminuto (Gran área relativa L2 vs masa mínima, flota en el aire) -->
    <g transform="translate(24, -12.00) scale(1)">
      <polygon points="0,-12 12,-6 0,0 -12,-6" fill="#38BDF8" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="-12,-6 0,0 0,13 -12,7" fill="#0284C7" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="0,0 12,-6 12,7 0,13" fill="#0369A1" stroke="#111827" stroke-width="3.5" stroke-linejoin="round"/>
      <!-- Líneas de sustentación de aire debajo del cubito -->
      <path d="M -14,18 Q 0,12 14,18" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>